<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Matrix Sci-Fi Text</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #08090d;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .canvas-container {
      position: relative;
      width: 90vw;
      max-width: 800px;
      height: 300px;
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
      background: radial-gradient(circle at center, #0d1117 0%, #05070a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 20px;
    }
    button {
      background: transparent;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 1.5px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
      transition: all 0.2s ease;
    }
    button:active {
      transform: scale(0.96);
      background: rgba(0, 255, 204, 0.2);
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="matrixCanvas"></canvas>
  </div>

  <div class="controls">
    <button onclick="startAnimation()">▶ REPLAY ANIMATION</button>
  </div>

  <script>
    // ===================================================
    // ✏️ EDIT YOUR TEXT AND DISPLAY SETTINGS HERE:
    // ===================================================
    const CONFIG = {
      text: "NERD_CORE",       // The message to display
      color: "#00ffcc",        // Cyan: #00ffcc | Green: #00ff66 | Pink: #ff007f | Amber: #ffb700
      dotRadius: 2.5,         // Radius of each dot (px)
      dotSpacing: 6,          // Grid spacing (lower = higher dot density)
      dotsPerFrame: 12,        // Speed (how many dots reveal per frame)
      glowBlur: 8             // Neon glow blur radius
    };
    // ===================================================

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let visibleCount = 0;
    let animId = null;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }

    function generatePoints() {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;

      // Calculate font size dynamically based on text length and canvas width
      const fontSize = Math.min(canvas.width / (CONFIG.text.length * 0.65), canvas.height * 0.5);
      offCtx.font = `900 ${fontSize}px "Courier New", monospace`;
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(CONFIG.text, offCanvas.width / 2, offCanvas.height / 2);

      const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
      points = [];

      // Sample pixels on a structured grid
      for (let x = 0; x < offCanvas.width; x += CONFIG.dotSpacing) {
        for (let y = 0; y < offCanvas.height; y += CONFIG.dotSpacing) {
          const index = (y * offCanvas.width + x) * 4;
          if (imgData.data[index + 3] > 128) {
            points.push({ x, y });
          }
        }
      }

      // Sort points left-to-right (with slight vertical jitter) for a scanline reveal
      points.sort((a, b) => (a.x + a.y * 0.1) - (b.x + b.y * 0.1));
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = CONFIG.color;
      ctx.shadowColor = CONFIG.color;
      ctx.shadowBlur = CONFIG.glowBlur;

      const currentPoints = points.slice(0, visibleCount);
      for (let i = 0; i < currentPoints.length; i++) {
        const pt = currentPoints[i];
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, CONFIG.dotRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      if (visibleCount < points.length) {
        visibleCount += CONFIG.dotsPerFrame;
        animId = requestAnimationFrame(animate);
      }
    }

    function startAnimation() {
      if (animId) cancelAnimationFrame(animId);
      resizeCanvas();
      generatePoints();
      visibleCount = 0;
      animate();
    }

    window.addEventListener('resize', startAnimation);
    window.addEventListener('load', startAnimation);
  </script>
</body>
</html>
